<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binaural</title>
    <style>
        /* --- COLOR PALETTE VARIABLES --- */
        :root {
            --orb-color: #007aff;
            --user-color: #ff9f0a;
            --bg-color: #f2f2f7;
            --surface: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --track-empty: rgba(0, 0, 0, 0.05);
            --shadow-device: 0 20px 40px -10px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.05);
            --btn-shadow-convex: -6px -6px 14px #fff, 6px 6px 10px rgba(0, 0, 0, 0.1);
            --btn-shadow-concave: inset 3px 3px 6px rgba(0, 0, 0, 0.1), inset -3px -3px 6px #fff;
        }

        /* Dark Mode Overrides */
        body.dark-mode {
            --bg-color: #000;
            --surface: #1c1c1e;
            --text-primary: #f2f2f7;
            --text-secondary: #8e8e93;
            --track-empty: rgba(255, 255, 255, 0.1);
            --shadow-device: 0 0 0 1px rgba(255, 255, 255, 0.1);
            --btn-shadow-convex: 0 10px 20px rgba(0, 0, 0, 0.5);
            --btn-shadow-concave: inset 0 3px 6px rgba(0, 0, 0, 0.6);
        }

        /* --- GLOBAL STYLES --- */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow: hidden;
            transition: background-color 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Background Orb Glow Effect */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 40%, var(--orb-color), transparent 70%);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            transition: opacity 1s ease;
        }

        body.dark-mode::after {
            opacity: 0.1;
        }

        /* --- DEVICE CONTAINER --- */
        .device-container {
            background: var(--surface);
            width: 85%;
            max-width: 380px;
            border-radius: 48px;
            padding: 50px 30px 40px;
            box-shadow: var(--shadow-device);
            text-align: center;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.5s ease;
        }

        /* --- VISUAL ORB --- */
        .orb-container {
            width: 140px;
            height: 140px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0 45px;
        }

        .orb-core {
            width: 100%;
            height: 100%;
            background: var(--orb-color);
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.6;
            transform: scale(0.8);
            transition: background-color 1s ease;
            will-change: transform, opacity;
        }

        .orb-core::after {
            content: '';
            position: absolute;
            top: 25%;
            left: 25%;
            width: 50%;
            height: 50%;
            background: white;
            border-radius: 50%;
            filter: blur(15px);
            opacity: 0.4;
        }

        /* --- TEXT & STATUS --- */
        .app-title {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 2px;
            opacity: 0.7;
        }

        #presetNameInput {
            background: transparent;
            border: none;
            font-family: inherit;
            font-size: 1.4rem;
            color: var(--text-primary);
            text-align: center;
            width: 100%;
            margin-bottom: 4px;
            outline: none;
            font-weight: 700;
            caret-color: var(--orb-color);
            transition: color 0.2s;
            padding: 0;
            letter-spacing: -0.02em;
        }

        .status-readout {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.01em;
            opacity: 0.9;
        }

        .divider {
            margin: 0 6px;
            opacity: 0.4;
        }

        /* Fade out UI when playing */
        .ui-fade {
            transition: opacity 0.8s ease;
            width: 100%;
        }

        body.playing .ui-fade {
            opacity: 0.3;
            pointer-events: none;
        }

        /* FIX: keep the custom panel usable while playing — live retuning is the
           whole point of handleSliderChange(). Opacity on a parent clips children,
           so the override has to lift the whole .ui-fade block, not just the panel. */
        body.playing.mode-custom .ui-fade {
            opacity: 1;
            pointer-events: auto;
        }

        body.playing #toggleBtn {
            opacity: 1;
            pointer-events: all;
        }

        /* --- PRESET BUTTONS --- */
        .preset-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 30px;
            width: 100%;
        }

        .preset-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--track-empty);
            border: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        /* Default SVG Icon Styling */
        .preset-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s, fill 0.2s;
        }

        .preset-btn:hover {
            transform: scale(1.05);
        }

        .preset-btn:focus-visible,
        .color-swatch:focus-visible,
        #toggleBtn:focus-visible {
            outline: 2px solid var(--orb-color);
            outline-offset: 3px;
        }

        /* Active Preset Button */
        .preset-btn.active {
            background: var(--orb-color);
            color: #fff;
            box-shadow: 0 10px 20px -5px var(--orb-color);
            transform: scale(1.15);
        }

        /* --- CUSTOM SLIDER PANEL --- */
        .custom-panel {
            width: 100%;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-align: left;
        }

        .custom-panel.visible {
            max-height: 320px;
            opacity: 1;
            margin-bottom: 20px;
        }

        .slider-group {
            margin-bottom: 25px;
            position: relative;
        }

        .slider-label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
            padding-left: 2px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* --- RANGE SLIDER STYLING --- */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
            height: 28px;
            margin: 0;
            display: block;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]:focus-visible::-webkit-slider-thumb {
            outline: 2px solid var(--orb-color);
            outline-offset: 2px;
        }

        /* Track Styling (with custom fill) — WebKit / Blink */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            border-radius: 10px;
            background: linear-gradient(to right, var(--orb-color) 0%, var(--orb-color) var(--progress), var(--track-empty) var(--progress), var(--track-empty) 100%);
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            margin-top: -9px;
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        /* FIX: Gecko equivalents — without these the --progress fill did nothing in Firefox */
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 6px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(to right, var(--orb-color) 0%, var(--orb-color) var(--progress), var(--track-empty) var(--progress), var(--track-empty) 100%);
        }

        input[type=range]::-moz-range-thumb {
            height: 24px;
            width: 24px;
            border: none;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        input[type=range]::-moz-focus-outer {
            border: 0;
        }

        /* --- COLOR SWATCHES --- */
        .color-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 20px;
            padding-top: 20px;
            padding-bottom: 25px;
            border-top: 1px solid var(--track-empty);
        }

        .color-swatch {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: transform 0.3s ease;
            position: relative;
        }

        .color-swatch.active {
            transform: scale(1.3);
        }

        .color-swatch.active::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            border: 2px solid var(--text-primary);
            opacity: 0.2;
        }

        /* --- TOGGLE PLAY/STOP BUTTON --- */
        #toggleBtn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: var(--surface);
            color: var(--text-primary);
            cursor: pointer;
            box-shadow: var(--btn-shadow-convex);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #toggleBtn:hover {
            transform: scale(1.02);
        }

        /* Inset Shadow when Playing */
        body.playing #toggleBtn {
            box-shadow: var(--btn-shadow-concave);
            transform: scale(0.98);
        }

        .icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
            stroke: none;
            transition: fill 0.3s;
        }

        body.playing .icon {
            fill: var(--orb-color);
        }

        /* --- MODE SPECIFIC COLORS --- */
        body.mode-sleep {
            --orb-color: #645cf0;
        }

        body.mode-meditate {
            --orb-color: #5ac8fa;
        }

        body.mode-focus {
            --orb-color: #34c759;
        }

        body.mode-gamma {
            --orb-color: #ff3b30;
        }

        body.mode-custom {
            --orb-color: var(--user-color);
        }

        /* --- HEADPHONES BADGE STYLING (hb) --- */
        .hb {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 10px;
            background: var(--track-empty);
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 25px;
            gap: 5px;
            opacity: 0.8;
            transition: opacity 0.8s ease;
        }

        .hb svg {
            width: 14px;
            height: 14px;
            fill: var(--orb-color);
        }

        body.playing .hb {
            opacity: 0;
            pointer-events: none;
        }

        /* Respect reduced-motion: hold the orb steady */
        @media (prefers-reduced-motion: reduce) {
            .orb-core {
                transform: scale(1) !important;
                opacity: 0.55 !important;
            }
        }
    </style>
</head>

<body class="mode-focus">
    <div class="device-container">
        <div class="ui-fade">
            <div class="app-title">BINAURAL</div>
            <input type="text" id="presetNameInput" value="Deep Focus" spellcheck="false" readonly
                aria-label="Preset name">
            <div class="status-readout" aria-live="polite">
                <span id="baseVal">200</span> Hz Tone
                <span class="divider">·</span>

            </div>
        </div>

        <div class="orb-container">
            <div class="orb-core" id="visualOrb" aria-hidden="true"></div>
        </div>

        <div class="ui-fade">
            <div class="preset-row" role="group" aria-label="Presets">
                <button class="preset-btn" aria-label="Deep Sleep preset" aria-pressed="false"
                    onclick="setPreset('sleep', this)">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M7 9m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                        <path d="M22 17v-3h-20" />
                        <path d="M2 8v9" />
                        <path d="M12 14h10v-2a3 3 0 0 0 -3 -3h-7v5z" />
                    </svg>
                </button>
                <button class="preset-btn" aria-label="Meditation preset" aria-pressed="false"
                    onclick="setPreset('meditate', this)">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M17 3.5a9 9 0 1 0 4 8.5" />
                    </svg>
                </button>
                <button class="preset-btn active" aria-label="Deep Focus preset" aria-pressed="true"
                    onclick="setPreset('focus', this)">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 18h6M10 21h4M9 18a8 8 0 1 1 6 0v1a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2v-1z" />
                    </svg>
                </button>
                <button class="preset-btn" aria-label="Gamma preset" aria-pressed="false"
                    onclick="setPreset('gamma', this)">
                    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 21v-9c0-2.7-1.5-5-4-6l-3-1 M12 21v-9c0-3 2-6 6-8" />
                    </svg>
                </button>
                <button class="preset-btn" id="customBtn" aria-label="Custom preset" aria-pressed="false"
                    onclick="enableCustomMode(this)">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>

            <div class="custom-panel" id="customPanel">
                <div class="slider-group">
                    <label class="slider-label" for="baseFreq">Base Tone</label>
                    <input type="range" id="baseFreq" min="100" max="500" value="200" step="5"
                        oninput="handleSliderChange(this)">
                </div>
                <div class="slider-group">
                    <label class="slider-label" for="beatFreq">Binaural Beat</label>
                    <input type="range" id="beatFreq" min="1" max="50" value="18" step="1"
                        oninput="handleSliderChange(this)">
                </div>
                <div class="color-row" role="group" aria-label="Accent color">
                    <button class="color-swatch active" aria-label="Orange" style="background: #ff9f0a"
                        onclick="setCustomColor('#ff9f0a', this)"></button>
                    <button class="color-swatch" aria-label="Pink" style="background: #ff375f"
                        onclick="setCustomColor('#ff375f', this)"></button>
                    <button class="color-swatch" aria-label="Teal" style="background: #30b0c7"
                        onclick="setCustomColor('#30b0c7', this)"></button>
                    <button class="color-swatch" aria-label="Yellow" style="background: #ffd60a"
                        onclick="setCustomColor('#ffd60a', this)"></button>
                    <button class="color-swatch" aria-label="Mint" style="background: #66d4cf"
                        onclick="setCustomColor('#66d4cf', this)"></button>
                    <button class="color-swatch" aria-label="Slate" style="background: #64748b"
                        onclick="setCustomColor('#64748b', this)"></button>
                </div>
            </div>
        </div>

        <div class="hb">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12v7c0 1.66 1.34 3 3 3h3v-8H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-3v8h3c1.66 0 3-1.34 3-3v-7c0-5.52-4.48-10-10-10z" />
            </svg>
            Headphones Required
        </div>

        <button id="toggleBtn" aria-label="Play" aria-pressed="false">
            <svg class="icon" id="iconPlay" viewBox="0 0 24 24" aria-hidden="true"
                style="display:block; fill:currentColor; stroke:none;">
                <path
                    d="M8 5.14v14.72a1.25 1.25 0 001.95 1.01l11.33-7.36a1.25 1.25 0 000-2.02L9.95 4.13A1.25 1.25 0 008 5.14z" />
            </svg>
            <svg class="icon" id="iconStop" viewBox="0 0 24 24" aria-hidden="true"
                style="display:none; fill:currentColor; stroke:none;">
                <rect x="6" y="6" width="12" height="12" rx="2" ry="2" />
            </svg>
        </button>
    </div>

    <script>
        /* --- GLOBAL AUDIO VARIABLES --- */
        let audioCtx, leftOsc, rightOsc, leftPan, rightPan, gainNode;
        let isPlaying = false;
        let currentMode = 'focus';
        let animFrame;

        const VOLUME = 0.2;
        const FADE_TC = 0.08;   // gain time constant (NOT a duration — see stopPlayback)
        const FADE_MS = 400;    // ~5 time constants: gain is effectively 0 by here

        /* --- DOM ELEMENT REFERENCES --- */
        const els = {
            base: document.getElementById('baseFreq'),
            beat: document.getElementById('beatFreq'),
            baseDisp: document.getElementById('baseVal'),
            beatDisp: document.getElementById('beatVal'),
            nameInput: document.getElementById('presetNameInput'),
            panel: document.getElementById('customPanel'),
            customBtn: document.getElementById('customBtn'),
            btns: document.querySelectorAll('.preset-btn'),
            swatches: document.querySelectorAll('.color-swatch'),
            orb: document.getElementById('visualOrb'),
            btn: document.getElementById('toggleBtn'),
            iconPlay: document.getElementById('iconPlay'),
            iconStop: document.getElementById('iconStop')
        };

        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* --- PRESET CONFIGURATION --- */
        const presets = {
            sleep: { base: 110, beat: 3, theme: 'mode-sleep', name: "Deep Sleep", cycle: 10, dark: true },
            meditate: { base: 160, beat: 10, theme: 'mode-meditate', name: "Meditation", cycle: 6, dark: false },
            focus: { base: 200, beat: 18, theme: 'mode-focus', name: "Deep Focus", cycle: 4, dark: false },
            gamma: { base: 250, beat: 40, theme: 'mode-gamma', name: "Gamma", cycle: 0.5, dark: false }
        };

        /* --- SLIDER LOGIC --- */

        function initSliders() {
            updateSliderFill(els.base);
            updateSliderFill(els.beat);
        }

        function updateSliderFill(slider) {
            const val = (slider.value - slider.min) / (slider.max - slider.min) * 100;
            slider.style.setProperty('--progress', val + '%');
        }

        function handleSliderChange(slider) {
            if (currentMode !== 'custom') return;
            updateSliderFill(slider);
            els.baseDisp.innerText = els.base.value;
            els.beatDisp.innerText = els.beat.value;
            updateAudio(0.1);
        }

        /* --- AUDIO LOGIC --- */

        function initAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }

        /**
         * Push the current slider values into the oscillators.
         * `timeConstant` is a setTargetAtTime time constant, not a ramp duration;
         * pass 0 for an immediate jump (used at start-up).
         */
        function updateAudio(timeConstant = 0.1) {
            if (!isPlaying || !audioCtx || !leftOsc || !rightOsc) return;
            const now = audioCtx.currentTime;
            const base = parseFloat(els.base.value);
            const beat = parseFloat(els.beat.value);
            const lf = base - (beat / 2);   // left ear
            const rf = base + (beat / 2);   // right ear

            if (timeConstant <= 0) {
                leftOsc.frequency.setValueAtTime(lf, now);
                rightOsc.frequency.setValueAtTime(rf, now);
            } else {
                leftOsc.frequency.setTargetAtTime(lf, now, timeConstant);
                rightOsc.frequency.setTargetAtTime(rf, now, timeConstant);
            }
        }

        /* --- VISUAL ANIMATION LOGIC --- */

        function animateOrb() {
            if (reduceMotion) return;   // CSS holds the orb steady

            if (!isPlaying) {
                const time = Date.now() / 2000;
                const scale = 0.9 + (0.05 * Math.sin(time));
                els.orb.style.transform = `scale(${scale})`;
                els.orb.style.opacity = 0.5;
            } else {
                const now = Date.now() / 1000;
                let cycleTime = presets[currentMode] ? presets[currentMode].cycle : 5;
                const rawSine = Math.sin((now * 2 * Math.PI) / cycleTime);

                let minScale = 0.8;
                let maxScale = 1.2;

                // Reduce visual intensity for high-frequency Gamma
                if (currentMode === 'gamma') {
                    minScale = 0.9;
                    maxScale = 1.1;
                }

                const scale = minScale + ((rawSine + 1) / 2) * (maxScale - minScale);
                els.orb.style.transform = `scale(${scale})`;
                els.orb.style.opacity = 0.6 + (rawSine * 0.15);
            }

            animFrame = requestAnimationFrame(animateOrb);
        }

        /* --- UI CONTROL FUNCTIONS --- */

        // FIX: the active button is passed in explicitly. The old code read a bare
        // `event.currentTarget`, which relies on the non-standard window.event global
        // and throws a ReferenceError in Firefox, aborting the rest of the function.
        function markActive(el) {
            els.btns.forEach(d => {
                d.classList.remove('active');
                d.setAttribute('aria-pressed', 'false');
            });
            if (el) {
                el.classList.add('active');
                el.setAttribute('aria-pressed', 'true');
            }
        }

        function setPreset(key, el) {
            currentMode = key;
            const p = presets[key];

            els.base.value = p.base;
            els.beat.value = p.beat;
            updateSliderFill(els.base);
            updateSliderFill(els.beat);

            els.baseDisp.innerText = p.base;
            els.beatDisp.innerText = p.beat;

            els.nameInput.value = p.name;
            els.nameInput.readOnly = true;

            document.body.className = isPlaying ? 'playing ' + p.theme : p.theme;
            if (p.dark) document.body.classList.add('dark-mode');
            else document.body.classList.remove('dark-mode');

            els.panel.classList.remove('visible');
            markActive(el);

            if (isPlaying) updateAudio(0.5);
        }

        function enableCustomMode(el) {
            currentMode = 'custom';
            document.body.className = isPlaying ? 'playing mode-custom' : 'mode-custom';
            document.body.classList.remove('dark-mode');

            els.nameInput.readOnly = false;
            if (els.nameInput.value !== "Custom Beat") els.nameInput.value = "Custom Beat";
            els.panel.classList.add('visible');

            // FIX: default to the "+" button, so entering custom mode via a color
            // swatch no longer leaves every preset button unhighlighted.
            markActive(el || els.customBtn);

            setTimeout(() => { els.nameInput.focus(); els.nameInput.select(); }, 100);
        }

        function setCustomColor(color, el) {
            document.documentElement.style.setProperty('--user-color', color);
            els.swatches.forEach(s => s.classList.remove('active'));
            el.classList.add('active');

            if (currentMode !== 'custom') enableCustomMode(els.customBtn);
        }

        /* --- PLAYBACK CONTROL --- */

        function setPlayingUI(playing) {
            els.iconPlay.style.display = playing ? 'none' : 'block';
            els.iconStop.style.display = playing ? 'block' : 'none';
            els.btn.setAttribute('aria-label', playing ? 'Stop' : 'Play');
            els.btn.setAttribute('aria-pressed', String(playing));
        }

        function startPlayback() {
            // 1. Create Nodes
            leftOsc = audioCtx.createOscillator();
            rightOsc = audioCtx.createOscillator();
            leftPan = audioCtx.createStereoPanner();
            rightPan = audioCtx.createStereoPanner();
            gainNode = audioCtx.createGain();

            // 2. Configure Nodes
            leftOsc.type = rightOsc.type = 'sine';
            leftPan.pan.value = -1; // Hard left
            rightPan.pan.value = 1; // Hard right
            gainNode.gain.value = 0;

            // 3. Connect Graph
            leftOsc.connect(leftPan).connect(gainNode);
            rightOsc.connect(rightPan).connect(gainNode);
            gainNode.connect(audioCtx.destination);

            // 4. FIX: flag must be set BEFORE updateAudio, which early-returns on
            // !isPlaying. Previously it bailed out here and both oscillators stayed
            // at the 440 Hz default — identical in both ears, so there was no
            // binaural beat at all until you touched a control.
            isPlaying = true;
            updateAudio(0);

            leftOsc.start();
            rightOsc.start();
            gainNode.gain.setTargetAtTime(VOLUME, audioCtx.currentTime, 0.4);

            document.body.classList.add('playing');
            if (presets[currentMode] && presets[currentMode].dark) {
                document.body.classList.add('dark-mode');
            }
            setPlayingUI(true);
        }

        function stopPlayback() {
            const now = audioCtx.currentTime;

            // Capture the current graph locally so a quick restart can build a new
            // one without this teardown reaching into it.
            const l = leftOsc, r = rightOsc, lp = leftPan, rp = rightPan, g = gainNode;
            leftOsc = rightOsc = leftPan = rightPan = gainNode = null;

            g.gain.cancelScheduledValues(now);
            g.gain.setValueAtTime(g.gain.value, now);
            // FIX: 0.08 time constant reaches ~0 within FADE_MS. The old code used a
            // 0.5 constant and cut the oscillators at 500 ms, i.e. while gain was
            // still ~0.07 — an audible click.
            g.gain.setTargetAtTime(0, now, FADE_TC);

            // FIX: state flips immediately, so a second click inside the fade window
            // starts playback instead of re-entering the stop branch.
            isPlaying = false;
            document.body.classList.remove('playing');
            setPlayingUI(false);

            setTimeout(() => {
                try { l.stop(); r.stop(); } catch (e) { /* already stopped */ }
                // FIX: disconnect the whole chain, not just the oscillators —
                // panners and gain nodes used to accumulate on every play.
                l.disconnect(); r.disconnect();
                lp.disconnect(); rp.disconnect(); g.disconnect();
            }, FADE_MS);
        }

        function togglePlay() {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) stopPlayback();
            else startPlayback();
        }

        /* --- INITIALIZATION --- */

        els.btn.addEventListener('click', togglePlay);

        initSliders();
        setPlayingUI(false);
        animateOrb();
    </script>
</body>

</html>
